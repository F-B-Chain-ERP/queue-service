server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: queue-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        format_sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:erp_rabbit}
    password: ${RABBITMQ_PASS:erp123456@}
    virtual-host: ${RABBITMQ_VHOST:erp_vhost}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:erp_minio}
    secret-key: ${MINIO_SECRET_KEY:erp123456@}
    bucket-name: ${MINIO_REPORT_BUCKET:${MINIO_BUCKET_NAME:erp-reports}}
    public-url: ${MINIO_PUBLIC_URL:/storage}
  report:
    minio-bucket-name: ${MINIO_REPORT_BUCKET:erp-reports}
    logo-path: ${REPORT_LOGO_PATH:classpath:/report/logo-erp.png}
  rabbitmq:
    report:
      exchange: ${RABBITMQ_REPORT_EXCHANGE:erp.report.exchange}
      dl-exchange: ${RABBITMQ_REPORT_DL_EXCHANGE:erp.report.dl.exchange}
      queue: ${RABBITMQ_REPORT_QUEUE:erp.report.queue}
      dlq: ${RABBITMQ_REPORT_DLQ:erp.report.dlq}
      routing-key: ${RABBITMQ_REPORT_ROUTING_KEY:report.generate}
      dl-routing-key: ${RABBITMQ_REPORT_DL_ROUTING_KEY:report.dead}
      ttl: ${RABBITMQ_REPORT_TTL:1800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
